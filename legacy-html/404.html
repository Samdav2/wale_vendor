<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;  /* pure black background - clean and blank */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img id="randomImage" alt="random image">

    <script>
        // Image pool - you can add more URLs here later
        const images = [
            "https://images.pexels.com/photos/12585740/pexels-photo-12585740.jpeg",
            "https://images.pexels.com/photos/12585740/pexels-photo-12585740.jpeg",
            "https://images.pexels.com/photos/33108908/pexels-photo-33108908.jpeg"
        ];

        // Pick random image
        const randomIndex = Math.floor(Math.random() * images.length);
        const selectedImage = images[randomIndex];

        // Display it
        const imgElement = document.getElementById('randomImage');
        imgElement.src = selectedImage;
    </script>
</body>
</html>
