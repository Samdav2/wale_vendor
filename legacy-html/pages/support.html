<!-- CHAT COMPONENT - inject this inside your #contentArea -->
<div class="chat-module" style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; overflow: hidden;">
  
  <!-- Messages area -->
  <div id="chatMessagesList" style="flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; background: #ffffff;">
    <div id="chatEmptyMsg" style="text-align: center; margin-top: 40px; color: #999; font-size: 14px;">💬 Send a message or share an image</div>
  </div>

  <!-- Input bar - matching your footer style -->
  <div style="background: #ffffff; padding: 8px 18px 12px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #f0f2f5;">
    <button id="chatAttachBtn" style="background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; min-width: 48px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c7a91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="10.5" r="2.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span style="font-size: 0.6rem; color: #6c7a91; font-weight: 450;">Image</span>
    </button>
    
    <input type="text" id="chatTextInput" placeholder="Type a message" autocomplete="off" style="flex: 1; border: 1px solid #e0e0e0; border-radius: 24px; padding: 10px 16px; font-size: 15px; outline: none; font-family: inherit; background: #ffffff; color: #1e293b;">
    
    <button id="chatSendBtn" style="background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; min-width: 48px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c7a91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
      <span style="font-size: 0.6rem; color: #6c7a91; font-weight: 450;">Send</span>
    </button>
  </div>

  <input type="file" id="chatImageFile" accept="image/jpeg, image/png, image/webp, image/gif" style="display: none;">
</div>

<script>
  (function() {
    const messagesDiv = document.getElementById('chatMessagesList');
    const emptyMsg = document.getElementById('chatEmptyMsg');
    const inputField = document.getElementById('chatTextInput');
    const sendBtn = document.getElementById('chatSendBtn');
    const attachBtn = document.getElementById('chatAttachBtn');
    const fileInput = document.getElementById('chatImageFile');
    
    let messages = [];
    
    function getTime() {
      const now = new Date();
      return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }
    
    function updateEmpty() {
      emptyMsg.style.display = messages.length === 0 ? 'block' : 'none';
    }
    
    function scrollBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function render() {
      const kids = [...messagesDiv.children];
      for (let kid of kids) {
        if (kid !== emptyMsg) kid.remove();
      }
      updateEmpty();
      
      for (let m of messages) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.width = '100%';
        row.style.justifyContent = m.sender === 'me' ? 'flex-end' : 'flex-start';
        
        const bubble = document.createElement('div');
        bubble.style.maxWidth = '80%';
        bubble.style.padding = '8px 12px';
        bubble.style.borderRadius = '18px';
        bubble.style.fontSize = '14px';
        bubble.style.lineHeight = '1.45';
        bubble.style.wordBreak = 'break-word';
        
        if (m.sender === 'me') {
          bubble.style.backgroundColor = '#e8e8e8';
          bubble.style.borderTopRightRadius = '4px';
          bubble.style.color = '#1e293b';
        } else {
          bubble.style.backgroundColor = '#f0f2f5';
          bubble.style.borderTopLeftRadius = '4px';
          bubble.style.color = '#1e293b';
        }
        
        if (m.type === 'text') {
          const textDiv = document.createElement('div');
          textDiv.innerText = m.content;
          bubble.appendChild(textDiv);
        } else if (m.type === 'image') {
          const img = document.createElement('img');
          img.src = m.content;
          img.style.maxWidth = '100%';
          img.style.maxHeight = '200px';
          img.style.borderRadius = '12px';
          img.style.display = 'block';
          img.style.margin = '2px 0 4px 0';
          img.style.cursor = 'pointer';
          img.onclick = () => window.open(m.content, '_blank');
          bubble.appendChild(img);
        }
        
        const meta = document.createElement('div');
        meta.style.fontSize = '10px';
        meta.style.textAlign = 'right';
        meta.style.marginTop = '4px';
        meta.style.opacity = '0.6';
        meta.style.display = 'flex';
        meta.style.justifyContent = 'flex-end';
        meta.style.gap = '4px';
        const timeSpan = document.createElement('span');
        timeSpan.innerText = m.time;
        meta.appendChild(timeSpan);
        if (m.sender === 'me') {
          const check = document.createElement('span');
          check.innerText = '✓✓';
          check.style.fontSize = '10px';
          meta.appendChild(check);
        }
        bubble.appendChild(meta);
        row.appendChild(bubble);
        messagesDiv.appendChild(row);
      }
      scrollBottom();
    }
    
    function addText(text, sender = 'me') {
      if (!text.trim()) return;
      messages.push({
        id: Date.now() + Math.random(),
        type: 'text',
        content: text.trim(),
        time: getTime(),
        sender: sender
      });
      render();
    }
    
    function addImage(dataUrl, sender = 'me') {
      if (!dataUrl) return;
      messages.push({
        id: Date.now() + Math.random(),
        type: 'image',
        content: dataUrl,
        time: getTime(),
        sender: sender
      });
      render();
    }
    
    function sendCurrent() {
      if (inputField.value.trim() === '') return;
      addText(inputField.value, 'me');
      inputField.value = '';
    }
    
    sendBtn.addEventListener('click', sendCurrent);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCurrent();
      }
    });
    
    attachBtn.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        alert('Image too large (max 5MB)');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => addImage(ev.target.result, 'me');
      reader.readAsDataURL(file);
      fileInput.value = '';
    });
    
    // Welcome message
    setTimeout(() => {
      if (messages.length === 0) {
        messages.push({
          id: Date.now(),
          type: 'text',
          content: '👋 Send a message or share an image',
          time: getTime(),
          sender: 'other'
        });
        render();
      }
    }, 100);
  })();
</script>
