<div style="max-width: 100%; background: white;">
  <!-- Notification Toast -->
  <div id="notificationToast" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0f172a; color: white; padding: 10px 18px; border-radius: 40px; font-size: 0.8rem; font-weight: 500; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; transition: transform 0.2s ease; pointer-events: none; max-width: 85vw; text-align: center; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>

  <!-- SEARCH BAR - ONLY visible on landing, before selection -->
  <div id="searchContainer" style="padding: 16px;">
    <label style="display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 600; color: #334155;">SEARCH VEG FOOD</label>
    <input type="text" id="foodSearchInput" placeholder="e.g., pizza, burger, pasta" autocomplete="off" style="width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px; font-size: 0.95rem; background: white; box-sizing: border-box;">
  </div>

  <!-- SEARCH RESULTS - appears only when typing -->
  <div id="searchResultsArea" style="display: none; border-top: 1px solid #eef2f6; padding: 12px 16px;">
    <div style="font-size: 0.7rem; font-weight: 600; color: #475569; margin-bottom: 8px;">SELECT ITEM</div>
    <div id="foodResultsGrid" style="display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 12px; scrollbar-width: none;"></div>
  </div>

  <!-- EDIT PANEL - appears only after selecting a food item -->
  <div id="editFoodPanel" style="display: none;">
    <!-- Name bar - non-editable -->
    <div style="padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; border-top: 1px solid #eef2f6;">
      <div style="font-size: 0.7rem; font-weight: 600; color: #64748b; margin-bottom: 4px;">ITEM NAME</div>
      <div id="selectedFoodName" style="font-size: 1rem; font-weight: 600; color: #0f172a;"></div>
    </div>

    <form id="foodEditForm">
      <!-- PRICE ROW -->
      <div style="padding: 14px 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">PRICING (₹) &amp; PREP TIME</label>
        <div style="display: flex; gap: 8px; flex-wrap: nowrap; width: 100%;">
          <input type="text" id="regPriceRs" placeholder="Regular price" value="" style="flex: 1; min-width: 0; width: 100%; padding: 10px 6px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; background: white; box-sizing: border-box;">
          <input type="text" id="offPriceRs" placeholder="Offer price" value="" style="flex: 1; min-width: 0; width: 100%; padding: 10px 6px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; background: white; box-sizing: border-box;">
          <input type="text" id="prepMins" placeholder="Prep (mins)" value="" style="flex: 1; min-width: 0; width: 100%; padding: 10px 6px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; background: white; box-sizing: border-box;">
        </div>
      </div>

      <!-- ROOM SERVICE BUTTON -->
      <div style="padding: 14px 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">ROOM SERVICE</label>
        <button type="button" id="roomSvcBtn" style="width: 100%; background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #1e293b;">Room service</button>
        <div id="serviceFeeRow" style="display: none; margin-top: 12px;">
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="serviceFeeRs" placeholder="Service fee (₹)" value="" style="flex: 2; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; background: white;">
            <button type="button" id="freeSvcBtn" style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 18px; font-size: 0.8rem; cursor: pointer;">Free</button>
          </div>
        </div>
      </div>

      <!-- INGREDIENTS -->
      <div style="padding: 14px 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">INGREDIENTS</label>
        <textarea id="ingredientsText" rows="2" placeholder="e.g., Fresh tomatoes, mozzarella, basil" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
      </div>

      <!-- SERVE WITH -->
      <div style="padding: 14px 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">SERVE WITH</label>
        <textarea id="serveWithText" rows="2" placeholder="e.g., Garlic bread, fries, sauce" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; font-family: inherit; resize: vertical; box-sizing: border-box;"></textarea>
      </div>

      <!-- DESCRIPTION -->
      <div style="padding: 14px 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">DESCRIPTION</label>
        <textarea id="descText" rows="4" placeholder="Detailed description of the dish..." style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; font-family: inherit; resize: vertical; min-height: 110px; box-sizing: border-box;"></textarea>
      </div>

      <button type="submit" style="width: 100%; background: #0f172a; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 0.95rem; font-weight: 600; cursor: pointer;">+ ADD FOOD ITEM</button>
    </form>
  </div>
</div>

<style>
  * {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  *::-webkit-scrollbar {
    display: none;
  }
  
  @media (max-width: 480px) {
    input, textarea, button {
      font-size: 14px !important;
    }
    input[type="text"] {
      font-size: 13px !important;
      padding: 8px 4px !important;
    }
  }
</style>

<script>
  (function() {
    const VEG_FOODS = [
      { id: 1, name: "Margherita Pizza", emoji: "🍕" },
      { id: 2, name: "Veggie Supreme Pizza", emoji: "🍕🥦" },
      { id: 3, name: "Veg Burger", emoji: "🍔" },
      { id: 4, name: "Paneer Tikka Burger", emoji: "🧀🍔" },
      { id: 5, name: "Spaghetti Aglio Olio", emoji: "🍝" },
      { id: 6, name: "Veg Pasta Alfredo", emoji: "🍝🥦" },
      { id: 7, name: "Caesar Salad", emoji: "🥗" },
      { id: 8, name: "Veggie Taco", emoji: "🌮" },
      { id: 9, name: "Paneer Butter Masala", emoji: "🍛" },
      { id: 10, name: "Veg Biryani", emoji: "🍚" },
      { id: 11, name: "Mix Veg Curry", emoji: "🥘" },
      { id: 12, name: "Grilled Cheese Sandwich", emoji: "🥪" },
      { id: 13, name: "Veg Spring Roll", emoji: "🌯" },
      { id: 14, name: "Mushroom Risotto", emoji: "🍚🍄" },
      { id: 15, name: "Veg Pad Thai", emoji: "🍜" }
    ];

    let selectedFoodObj = null;
    let roomActive = false;
    let isFreeActive = false;
    let notificationTimeout = null;

    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('foodSearchInput');
    const resultsArea = document.getElementById('searchResultsArea');
    const resultsGrid = document.getElementById('foodResultsGrid');
    const editPanel = document.getElementById('editFoodPanel');
    const selectedNameDiv = document.getElementById('selectedFoodName');
    const roomBtn = document.getElementById('roomSvcBtn');
    const feeRow = document.getElementById('serviceFeeRow');
    const serviceFeeInp = document.getElementById('serviceFeeRs');
    const freeBtn = document.getElementById('freeSvcBtn');
    const foodForm = document.getElementById('foodEditForm');
    const regPrice = document.getElementById('regPriceRs');
    const offPrice = document.getElementById('offPriceRs');
    const prepMins = document.getElementById('prepMins');
    const ingredientsInp = document.getElementById('ingredientsText');
    const serveWithInp = document.getElementById('serveWithText');
    const descInp = document.getElementById('descText');
    const notificationToast = document.getElementById('notificationToast');

    function showNotification(message, isSuccess = true) {
      if (notificationTimeout) clearTimeout(notificationTimeout);
      
      notificationToast.textContent = message;
      notificationToast.style.background = isSuccess ? '#0f172a' : '#dc2626';
      notificationToast.style.transform = 'translateX(-50%) translateY(0)';
      
      notificationTimeout = setTimeout(() => {
        notificationToast.style.transform = 'translateX(-50%) translateY(-100px)';
      }, 2000);
    }

    function resetToSearchView() {
      searchContainer.style.display = "block";
      resultsArea.style.display = "none";
      resultsGrid.innerHTML = "";
      editPanel.style.display = "none";
      searchInput.value = "";
      selectedFoodObj = null;
    }

    function renderSearchResults(query) {
      const trimmed = query.trim();
      if (trimmed === "") {
        resultsArea.style.display = "none";
        return;
      }
      const lowerQuery = trimmed.toLowerCase();
      const filtered = VEG_FOODS.filter(f => f.name.toLowerCase().includes(lowerQuery));
      
      resultsArea.style.display = "block";
      if (filtered.length === 0) {
        resultsGrid.innerHTML = `<div style="padding: 20px; text-align:center; width:100%; color:#94a3b8;">No veg item found</div>`;
        return;
      }
      
      resultsGrid.innerHTML = "";
      filtered.forEach(food => {
        const card = document.createElement('div');
        card.style.cssText = 'flex: 0 0 110px; background: white; border-radius: 16px; border: 2px solid #eef2f8; cursor: pointer; text-align: center; padding: 12px 6px; transition: 0.1s;';
        if (selectedFoodObj && selectedFoodObj.id === food.id) {
          card.style.border = '2px solid #0f172a';
          card.style.background = '#fefce8';
        }
        const photoSpan = document.createElement('div');
        photoSpan.style.fontSize = '48px';
        photoSpan.textContent = food.emoji;
        const nameSpan = document.createElement('div');
        nameSpan.style.fontSize = '0.75rem';
        nameSpan.style.fontWeight = '600';
        nameSpan.style.marginTop = '6px';
        nameSpan.textContent = food.name;
        card.appendChild(photoSpan);
        card.appendChild(nameSpan);
        card.onclick = () => selectFood(food);
        resultsGrid.appendChild(card);
      });
    }

    function selectFood(food) {
      selectedFoodObj = food;
      
      searchContainer.style.display = "none";
      resultsArea.style.display = "none";
      editPanel.style.display = "block";
      selectedNameDiv.textContent = food.name;
      
      regPrice.value = "";
      offPrice.value = "";
      prepMins.value = "";
      
      roomActive = false;
      isFreeActive = false;
      updateRoomUI();
      
      ingredientsInp.value = "";
      serveWithInp.value = "";
      descInp.value = "";
      
      serviceFeeInp.value = "";
      serviceFeeInp.disabled = false;
      serviceFeeInp.style.background = "white";
      freeBtn.style.background = "#f1f5f9";
      freeBtn.style.color = "#1e293b";
      freeBtn.style.borderColor = "#cbd5e1";
      freeBtn.textContent = "Free";
    }

    function updateRoomUI() {
      if (roomActive) {
        roomBtn.style.background = "#0f172a";
        roomBtn.style.color = "white";
        roomBtn.style.borderColor = "#0f172a";
        feeRow.style.display = "block";
      } else {
        roomBtn.style.background = "#f1f5f9";
        roomBtn.style.color = "#1e293b";
        roomBtn.style.borderColor = "#e2e8f0";
        feeRow.style.display = "none";
        isFreeActive = false;
        freeBtn.style.background = "#f1f5f9";
        freeBtn.style.color = "#1e293b";
        freeBtn.textContent = "Free";
        if (serviceFeeInp) {
          serviceFeeInp.value = "";
          serviceFeeInp.disabled = false;
          serviceFeeInp.style.background = "white";
        }
      }
    }

    roomBtn.addEventListener('click', () => {
      roomActive = !roomActive;
      updateRoomUI();
      if (roomActive) {
        isFreeActive = false;
        freeBtn.style.background = "#f1f5f9";
        freeBtn.style.color = "#1e293b";
        freeBtn.textContent = "Free";
        serviceFeeInp.disabled = false;
        serviceFeeInp.value = "";
        serviceFeeInp.style.background = "white";
      }
    });

    freeBtn.addEventListener('click', () => {
      if (!roomActive) {
        showNotification("Please activate Room Service first", false);
        return;
      }
      if (!isFreeActive) {
        isFreeActive = true;
        freeBtn.style.background = "#166534";
        freeBtn.style.color = "white";
        freeBtn.style.borderColor = "#166534";
        freeBtn.textContent = "✓ Free";
        serviceFeeInp.value = "0";
        serviceFeeInp.disabled = true;
        serviceFeeInp.style.background = "#f1f5f9";
      } else {
        isFreeActive = false;
        freeBtn.style.background = "#f1f5f9";
        freeBtn.style.color = "#1e293b";
        freeBtn.style.borderColor = "#cbd5e1";
        freeBtn.textContent = "Free";
        serviceFeeInp.value = "";
        serviceFeeInp.disabled = false;
        serviceFeeInp.style.background = "white";
      }
    });

    foodForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!selectedFoodObj) {
        showNotification("Please select a food item", false);
        return;
      }
      
      const regularVal = regPrice.value.trim();
      const offerVal = offPrice.value.trim();
      const prepVal = prepMins.value.trim();
      const serviceFeeVal = serviceFeeInp.value.trim();
      
      if (regularVal === "") {
        showNotification("Regular price is required", false);
        return;
      }
      if (prepVal === "") {
        showNotification("Preparation time is required", false);
        return;
      }
      
      let finalServiceFee = null;
      if (roomActive) {
        if (isFreeActive) {
          finalServiceFee = "0";
        } else {
          if (serviceFeeVal === "") {
            showNotification("Enter service fee or click Free", false);
            return;
          }
          finalServiceFee = serviceFeeVal;
        }
      }
      
      const ingredients = ingredientsInp.value.trim();
      const serveWith = serveWithInp.value.trim();
      const description = descInp.value.trim();
      
      console.log("Food Data:", {
        foodId: selectedFoodObj.id,
        name: selectedFoodObj.name,
        regularPriceRs: regularVal,
        offerPriceRs: offerVal || null,
        prepareTimeMins: prepVal,
        roomService: { active: roomActive, fee: finalServiceFee, isFree: isFreeActive && roomActive },
        ingredients, serveWith, description
      });
      
      showNotification(`✓ ${selectedFoodObj.name} added successfully`);
      
      setTimeout(() => {
        resetToSearchView();
      }, 600);
    });
    
    searchInput.addEventListener('input', (e) => {
      if (editPanel.style.display === "block") return;
      
      const query = e.target.value;
      if (query.trim() === "") {
        resultsArea.style.display = "none";
        resultsGrid.innerHTML = "";
      } else {
        renderSearchResults(query);
      }
    });
    
    resultsArea.style.display = "none";
    editPanel.style.display = "none";
    selectedFoodObj = null;
  })();
</script>
