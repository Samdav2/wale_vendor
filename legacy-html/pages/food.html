<div style="max-width: 100%; background: white; margin: 0; padding: 0;">
  <div id="foodsContainer" style="margin: 0; padding: 0;">
    <div id="foodsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0; margin: 0;"></div>
  </div>

  <div id="foodEditPanel" style="display: none; margin: 0; padding: 0;">
    <div style="padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
      <div style="font-size: 0.7rem; font-weight: 600; color: #64748b; margin-bottom: 4px;">ITEM NAME</div>
      <div id="selectedFoodName" style="font-size: 1rem; font-weight: 600; color: #0f172a; word-break: keep-all; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"></div>
    </div>

    <form id="foodEditForm" style="padding: 16px;">
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">PRICING (₹) &amp; PREP TIME</label>
        <div style="display: flex; gap: 6px; flex-wrap: nowrap;">
          <input type="number" id="regPriceRs" placeholder="Regular" style="flex: 1; min-width: 0; width: 100%; padding: 10px 4px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; appearance: textfield; -moz-appearance: textfield;">
          <input type="number" id="offPriceRs" placeholder="Offer" style="flex: 1; min-width: 0; width: 100%; padding: 10px 4px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; appearance: textfield; -moz-appearance: textfield;">
          <input type="number" id="prepMins" placeholder="Mins" style="flex: 0.8; min-width: 0; width: 100%; padding: 10px 4px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.75rem; text-align: center; appearance: textfield; -moz-appearance: textfield;">
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">ROOM SERVICE</label>
        <button type="button" id="roomSvcBtn" style="width: 100%; background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">Room service</button>
        <div id="serviceFeeRow" style="display: none; margin-top: 12px;">
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="number" id="serviceFeeRs" placeholder="Service fee (₹)" style="flex: 2; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.8rem; appearance: textfield; -moz-appearance: textfield;">
            <button type="button" id="freeSvcBtn" style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 14px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;">Free</button>
          </div>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">INGREDIENTS</label>
        <textarea id="ingredientsText" rows="2" placeholder="e.g., Fresh tomatoes, mozzarella, basil" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; resize: vertical; box-sizing: border-box;"></textarea>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">SERVE WITH</label>
        <textarea id="serveWithText" rows="2" placeholder="e.g., Garlic bread, fries, sauce" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; resize: vertical; box-sizing: border-box;"></textarea>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: #334155;">DESCRIPTION</label>
        <textarea id="descText" rows="4" placeholder="Detailed description of the dish..." style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; resize: vertical; min-height: 100px; box-sizing: border-box;"></textarea>
      </div>

      <div style="display: flex; gap: 12px;">
        <button type="button" id="cancelFoodEditBtn" style="flex: 1; background: #f1f5f9; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer;">Cancel</button>
        <button type="submit" style="flex: 1; background: #0f172a; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer;">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<style>
  * {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }
  *::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }
  body, html {
    margin: 0;
    padding: 0;
    overflow: auto;
  }
  .food-card {
    background: white;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    position: relative;
  }
  .food-image-wrapper {
    position: relative;
    width: 100%;
  }
  .food-image {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }
  .food-price-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(4px);
    color: white;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 700;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .food-info {
    padding: 12px;
  }
  .food-name {
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #foodsContainer, #foodEditPanel {
    margin: 0;
    padding: 0;
  }
  
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
</style>

<script>
  (function() {
    let foodsData = [];

    function loadFoods() {
      const stored = localStorage.getItem('hotel_foods_data');
      if (stored) {
        try {
          foodsData = JSON.parse(stored);
          if (Array.isArray(foodsData)) return;
        } catch(e) {}
      }
      foodsData = [
        { id: 1, name: "Aloo Puri", price: 89, regularPrice: 89, offerPrice: null, prepTime: 15, image: "https://images.unsplash.com/photo-1616307000399-b3b3b1c1c6e4?w=400&h=300&fit=crop", roomService: { active: false, fee: null, isFree: false }, ingredients: "Aloo sabzi, puri, spices", serveWith: "Pickle, onion", description: "Classic breakfast dish from Vrindavan", category: "Veg" },
        { id: 2, name: "Chole Bhature", price: 99, regularPrice: 99, offerPrice: 89, prepTime: 20, image: "https://images.unsplash.com/photo-1627234945206-2bdbdbb20d05?w=400&h=300&fit=crop", roomService: { active: true, fee: 20, isFree: false }, ingredients: "Chickpeas, bhature, spices", serveWith: "Onion, pickle", description: "Popular Punjabi dish loved in Vrindavan", category: "Veg" },
        { id: 3, name: "Paneer Thali", price: 149, regularPrice: 149, offerPrice: null, prepTime: 25, image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=400&h=300&fit=crop", roomService: { active: false, fee: null, isFree: false }, ingredients: "Shahi paneer, dal, roti, rice, salad", serveWith: "Papad, pickle", description: "Complete meal with paneer curry", category: "Veg" },
        { id: 4, name: "Kadhi Chawal", price: 79, regularPrice: 79, offerPrice: 69, prepTime: 18, image: "https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=400&h=300&fit=crop", roomService: { active: true, fee: 15, isFree: false }, ingredients: "Kadhi, pakode, steamed rice", serveWith: "Papad", description: "Comfort food from Vrindavan kitchens", category: "Veg" },
        { id: 5, name: "Malai Kofta", price: 139, regularPrice: 139, offerPrice: 119, prepTime: 30, image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=400&h=300&fit=crop", roomService: { active: false, fee: null, isFree: false }, ingredients: "Paneer kofta, creamy gravy, nuts", serveWith: "Naan, roti", description: "Rich and creamy vegetable kofta curry", category: "Veg" },
        { id: 6, name: "Dal Makhani", price: 109, regularPrice: 109, offerPrice: null, prepTime: 25, image: "https://images.unsplash.com/photo-1546833998-877b37c2e5c6?w=400&h=300&fit=crop", roomService: { active: true, fee: 18, isFree: true }, ingredients: "Black lentils, butter, cream, spices", serveWith: "Butter naan", description: "Creamy black lentil dal", category: "Veg" },
        { id: 7, name: "Veg Biryani", price: 129, regularPrice: 129, offerPrice: 109, prepTime: 28, image: "https://images.unsplash.com/photo-1563379091339-03b21dd4a9f8?w=400&h=300&fit=crop", roomService: { active: false, fee: null, isFree: false }, ingredients: "Basmati rice, mixed vegetables, biryani masala", serveWith: "Raita", description: "Aromatic vegetable biryani", category: "Veg" },
        { id: 8, name: "Gulab Jamun", price: 49, regularPrice: 49, offerPrice: 39, prepTime: 10, image: "https://images.unsplash.com/photo-1602526432608-b8f8b6c3a382?w=400&h=300&fit=crop", roomService: { active: false, fee: null, isFree: false }, ingredients: "Milk solids, sugar, cardamom", serveWith: "None", description: "Sweet dessert from Vrindavan", category: "Dessert" }
      ];
    }

    function saveFoods() {
      localStorage.setItem('hotel_foods_data', JSON.stringify(foodsData));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderFoodGrid() {
      const grid = document.getElementById('foodsGrid');
      if (!grid) return;
      let html = '';
      for (let i = 0; i < foodsData.length; i++) {
        const f = foodsData[i];
        const displayPrice = f.offerPrice || f.regularPrice;
        html += '<div class="food-card">';
        html += '<div class="food-image-wrapper">';
        html += '<img src="' + (f.image || 'https://placehold.co/400x300') + '" class="food-image" onerror="this.src=\'https://placehold.co/400x300\'">';
        html += '<div class="food-price-badge">₹' + displayPrice + '</div>';
        html += '</div>';
        html += '<div class="food-info">';
        html += '<span class="food-name" data-food-index="' + i + '">' + escapeHtml(f.name) + '</span>';
        html += '</div></div>';
      }
      grid.innerHTML = html;

      document.querySelectorAll('.food-name').forEach(el => {
        el.addEventListener('click', (e) => {
          const idx = parseInt(el.getAttribute('data-food-index'));
          openFoodEditPanel(idx);
        });
      });
    }

    let currentFoodEditIndex = null;
    let roomActive = false;
    let isFreeActive = false;

    function openFoodEditPanel(index) {
      currentFoodEditIndex = index;
      const food = foodsData[index];

      document.getElementById('selectedFoodName').textContent = food.name;
      document.getElementById('regPriceRs').value = food.regularPrice || '';
      document.getElementById('offPriceRs').value = food.offerPrice || '';
      document.getElementById('prepMins').value = food.prepTime || '';
      document.getElementById('ingredientsText').value = food.ingredients || '';
      document.getElementById('serveWithText').value = food.serveWith || '';
      document.getElementById('descText').value = food.description || '';

      roomActive = food.roomService?.active || false;
      isFreeActive = food.roomService?.isFree || false;
      updateRoomUI();

      const serviceFeeInp = document.getElementById('serviceFeeRs');
      if (food.roomService?.fee !== undefined && food.roomService?.fee !== null) {
        serviceFeeInp.value = food.roomService.fee;
      } else {
        serviceFeeInp.value = '';
      }

      document.getElementById('foodsContainer').style.display = 'none';
      document.getElementById('foodEditPanel').style.display = 'block';
    }

    function closeFoodEditPanel() {
      document.getElementById('foodEditPanel').style.display = 'none';
      document.getElementById('foodsContainer').style.display = 'block';
      currentFoodEditIndex = null;
    }

    function updateRoomUI() {
      const roomBtn = document.getElementById('roomSvcBtn');
      const feeRow = document.getElementById('serviceFeeRow');
      const serviceFeeInp = document.getElementById('serviceFeeRs');
      const freeBtn = document.getElementById('freeSvcBtn');

      if (roomActive) {
        roomBtn.style.background = "#0f172a";
        roomBtn.style.color = "white";
        roomBtn.style.borderColor = "#0f172a";
        feeRow.style.display = "block";
        
        if (isFreeActive) {
          freeBtn.style.background = "#166534";
          freeBtn.style.color = "white";
          freeBtn.style.borderColor = "#166534";
          freeBtn.textContent = "✓ Free";
          serviceFeeInp.value = "0";
          serviceFeeInp.disabled = true;
          serviceFeeInp.style.background = "#f1f5f9";
        } else {
          freeBtn.style.background = "#f1f5f9";
          freeBtn.style.color = "#1e293b";
          freeBtn.style.borderColor = "#cbd5e1";
          freeBtn.textContent = "Free";
          serviceFeeInp.disabled = false;
          serviceFeeInp.style.background = "white";
        }
      } else {
        roomBtn.style.background = "#f1f5f9";
        roomBtn.style.color = "#1e293b";
        roomBtn.style.borderColor = "#e2e8f0";
        feeRow.style.display = "none";
      }
    }

    function saveFoodEdit() {
      if (currentFoodEditIndex === null) return;

      const food = foodsData[currentFoodEditIndex];
      
      food.regularPrice = parseFloat(document.getElementById('regPriceRs').value);
      const offerVal = document.getElementById('offPriceRs').value;
      food.offerPrice = offerVal ? parseFloat(offerVal) : null;
      food.prepTime = parseInt(document.getElementById('prepMins').value);
      food.ingredients = document.getElementById('ingredientsText').value;
      food.serveWith = document.getElementById('serveWithText').value;
      food.description = document.getElementById('descText').value;
      food.price = food.offerPrice || food.regularPrice;
      
      food.roomService = {
        active: roomActive,
        fee: roomActive ? (isFreeActive ? 0 : parseFloat(document.getElementById('serviceFeeRs').value)) : null,
        isFree: isFreeActive
      };

      saveFoods();
      renderFoodGrid();
      closeFoodEditPanel();
    }

    document.getElementById('foodEditForm').addEventListener('submit', (e) => {
      e.preventDefault();
      saveFoodEdit();
    });

    document.getElementById('cancelFoodEditBtn').addEventListener('click', closeFoodEditPanel);

    document.getElementById('roomSvcBtn').addEventListener('click', () => {
      roomActive = !roomActive;
      if (!roomActive) {
        isFreeActive = false;
      }
      updateRoomUI();
    });

    document.getElementById('freeSvcBtn').addEventListener('click', () => {
      if (!roomActive) {
        alert('Please activate Room Service first');
        return;
      }
      isFreeActive = !isFreeActive;
      updateRoomUI();
    });

    loadFoods();
    renderFoodGrid();
  })();
</script>
