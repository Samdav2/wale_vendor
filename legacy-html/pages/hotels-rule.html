<div style="margin:0; padding:0; width:100%; background:white;">
  <div id="ruleToast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#0f172a; color:white; padding:8px 16px; border-radius:40px; font-size:0.75rem; z-index:9999; transition:0.2s; pointer-events:none;"></div>

  <!-- Rules Display Mode -->
  <div id="rulesDisplay" style="padding:16px 0;">
    <div id="rulesContent" style="font-size:0.85rem; line-height:1.6; color:#1e293b; white-space:pre-wrap; padding:0; cursor:pointer;"></div>
  </div>

  <!-- Rules Edit Mode -->
  <div id="rulesEdit" style="display:none; padding:16px 0;">
    <textarea id="rulesTextarea" rows="12" style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:8px; font-size:0.85rem; line-height:1.5; font-family:inherit; resize:vertical;"></textarea>
    <div style="display:flex; gap:12px; margin-top:12px; padding:0;">
      <button id="saveRulesBtn" style="flex:1; padding:10px; background:#0f172a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:0.85rem;">Save</button>
      <button id="cancelRulesBtn" style="flex:1; padding:10px; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; border-radius:8px; cursor:pointer; font-size:0.85rem;">Cancel</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100000; align-items:center; justify-content:center;">
  <div style="background:white; width:85%; max-width:280px; border-radius:12px; overflow:hidden;">
    <div style="background:#0f172a; padding:14px; color:white; font-weight:600; font-size:0.9rem; text-align:center;">Confirm</div>
    <div style="padding:20px; text-align:center;"><p id="confirmMsg" style="margin:0; font-size:0.9rem;">Are you sure?</p></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #eef2f6;">
      <button id="confirmNo" style="padding:12px; border:none; background:#f8fafc; color:#475569; border-right:1px solid #eef2f6; cursor:pointer;">Cancel</button>
      <button id="confirmYes" style="padding:12px; border:none; background:#f8fafc; color:#dc2626; cursor:pointer;">Confirm</button>
    </div>
  </div>
</div>

<style>
  *{margin:0; padding:0; box-sizing:border-box; scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  body, html{margin:0; padding:0;}
</style>

<script>
(function(){
  const STORAGE_KEY = 'house_rules';
  const defaultRules = `1. Check-in time is 2:00 PM and check-out time is 11:00 AM.

2. Valid government ID proof is required for all guests at check-in.

3. Smoking is strictly prohibited inside the rooms. A fine of ₹2000 will be charged for violation.

4. Pets are not allowed inside the hotel premises.

5. Guests are requested to maintain silence in corridors after 10:00 PM.

6. Any damage to hotel property will be charged to the guest.

7. Outside food and alcohol are not allowed in the rooms.

8. Hotel is not responsible for any lost valuables. Please use the locker facility.

9. Visitors are not allowed in guest rooms after 9:00 PM.

10. Early check-in and late check-out are subject to availability and may incur extra charges.

We wish you a pleasant stay!`;
  
  let rules = localStorage.getItem(STORAGE_KEY);
  if(!rules){
    rules = defaultRules;
    localStorage.setItem(STORAGE_KEY, rules);
  }
  
  function toast(msg, isErr){ 
    let t = document.getElementById('ruleToast');
    t.textContent = msg;
    t.style.background = isErr ? '#b91c1c' : '#0f172a';
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => t.style.transform = 'translateX(-50%) translateY(-100px)', 2000);
  }
  
  function confirm(msg, onYes){
    let modal = document.getElementById('confirmModal');
    document.getElementById('confirmMsg').textContent = msg;
    modal.style.display = 'flex';
    let yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');
    let handler = () => { modal.style.display = 'none'; yes.removeEventListener('click', yh); no.removeEventListener('click', nh); };
    let yh = () => { handler(); onYes(); };
    let nh = () => { handler(); };
    yes.addEventListener('click', yh);
    no.addEventListener('click', nh);
  }
  
  function showDisplayMode(){
    document.getElementById('rulesDisplay').style.display = 'block';
    document.getElementById('rulesEdit').style.display = 'none';
    document.getElementById('rulesContent').innerHTML = escapeHtml(rules).replace(/\n/g, '<br>');
  }
  
  function showEditMode(){
    document.getElementById('rulesDisplay').style.display = 'none';
    document.getElementById('rulesEdit').style.display = 'block';
    document.getElementById('rulesTextarea').value = rules;
    document.getElementById('rulesTextarea').focus();
  }
  
  function saveRules(){
    let newRules = document.getElementById('rulesTextarea').value;
    if(newRules.trim() === ''){
      toast('Rules cannot be empty', true);
      return;
    }
    rules = newRules;
    localStorage.setItem(STORAGE_KEY, rules);
    showDisplayMode();
    toast('Rules saved');
  }
  
  function cancelEdit(){
    if(document.getElementById('rulesTextarea').value !== rules){
      confirm('Discard changes?', () => {
        showDisplayMode();
      });
    } else {
      showDisplayMode();
    }
  }
  
  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  }
  
  // Double click on display area to edit
  document.getElementById('rulesDisplay').ondblclick = showEditMode;
  
  document.getElementById('saveRulesBtn').onclick = saveRules;
  document.getElementById('cancelRulesBtn').onclick = cancelEdit;
  
  document.getElementById('confirmModal').onclick = (e) => { 
    if(e.target === document.getElementById('confirmModal')) 
      document.getElementById('confirmModal').style.display = 'none'; 
  };
  
  // Force remove parent gaps
  let p = document.currentScript;
  while(p && p !== document.body) {
    if(p.style) { p.style.margin = '0'; p.style.padding = '0'; }
    p = p.parentElement;
  }
  if(document.body) { document.body.style.margin = '0'; document.body.style.padding = '0'; }
  if(document.documentElement) { document.documentElement.style.margin = '0'; document.documentElement.style.padding = '0'; }
  
  showDisplayMode();
})();
</script>
