<div style="max-width: 100%; background: white;">
  <!-- Notification Toast -->
  <div id="notificationToast" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0f172a; color: white; padding: 12px 20px; border-radius: 48px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); z-index: 9999; transition: transform 0.25s ease; pointer-events: none; white-space: nowrap; max-width: 90vw; white-space: normal; text-align: center; line-height: 1.4;"></div>

  <!-- SEARCH BAR - ONLY visible on landing, before selection -->
  <div id="searchContainer" style="padding: 16px;">
    <label style="display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 600; color: #334155;">SEARCH USER</label>
    <input type="text" id="userSearchInput" placeholder="Username, Phone or Email" autocomplete="off" style="width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px; font-size: 0.95rem; background: white; box-sizing: border-box;">
  </div>

  <!-- SEARCH RESULTS - appears only when typing -->
  <div id="searchResultsArea" style="display: none; border-top: 1px solid #eef2f6; padding: 12px 16px;">
    <div style="font-size: 0.7rem; font-weight: 600; color: #475569; margin-bottom: 8px;">SELECT USER</div>
    <div id="userResultsGrid" style="display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; scrollbar-width: none;"></div>
  </div>

  <!-- EDIT PANEL - appears only after selecting a user -->
  <div id="editPanel" style="display: none;">
    <!-- User profile header: picture + name -->
    <div style="padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; border-top: 1px solid #eef2f6; display: flex; align-items: center; gap: 14px;">
      <div id="userAvatar" style="width: 56px; height: 56px; background: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; overflow: hidden; flex-shrink: 0;"></div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 0.7rem; font-weight: 600; color: #64748b; margin-bottom: 4px;">SELECTED USER</div>
        <div id="selectedUserName" style="font-size: 1rem; font-weight: 600; color: #0f172a; word-break: break-word;"></div>
        <div id="selectedUserContact" style="font-size: 0.7rem; color: #64748b; margin-top: 2px;"></div>
      </div>
    </div>

    <form id="userRoleForm">
      <!-- Role Selection -->
      <div style="padding: 16px; border-bottom: 1px solid #ecf3f9;">
        <label style="display: block; margin-bottom: 10px; font-size: 0.75rem; font-weight: 600; color: #334155;">ASSIGN ROLE</label>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; transition: 0.1s;">
            <input type="radio" name="userRole" value="General Manager" style="width: 18px; height: 18px; cursor: pointer;">
            <span style="font-size: 0.9rem; font-weight: 500; color: #1e293b;">General Manager</span>
          </label>
          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; transition: 0.1s;">
            <input type="radio" name="userRole" value="Front Desk Manager" style="width: 18px; height: 18px; cursor: pointer;">
            <span style="font-size: 0.9rem; font-weight: 500; color: #1e293b;">Front Desk Manager</span>
          </label>
          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; transition: 0.1s;">
            <input type="radio" name="userRole" value="F&B Manager" style="width: 18px; height: 18px; cursor: pointer;">
            <span style="font-size: 0.9rem; font-weight: 500; color: #1e293b;">F&amp;B Manager</span>
          </label>
          <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; transition: 0.1s;">
            <input type="radio" name="userRole" value="Booking Agent" style="width: 18px; height: 18px; cursor: pointer;">
            <span style="font-size: 0.9rem; font-weight: 500; color: #1e293b;">Booking Agent</span>
          </label>
        </div>
      </div>

      <button type="submit" style="width: 100%; background: #0f172a; color: white; border: none; padding: 14px; font-size: 0.95rem; font-weight: 600; cursor: pointer;">+ ASSIGN ROLE &amp; SAVE</button>
    </form>
  </div>
</div>

<style>
  * {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  *::-webkit-scrollbar {
    display: none;
  }
  
  .user-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .user-item:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  .user-item.selected {
    border: 2px solid #0f172a;
    background: #fefce8;
  }
  .user-avatar-small {
    width: 48px;
    height: 48px;
    background: #0f172a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: white;
    flex-shrink: 0;
  }
  .user-info {
    flex: 1;
    min-width: 0;
  }
  .user-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: #1e293b;
  }
  .user-contact {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 2px;
  }
  
  @media (max-width: 480px) {
    .user-item {
      padding: 10px 12px;
    }
    .user-avatar-small {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }
    .user-name {
      font-size: 0.85rem;
    }
  }
</style>

<script>
  (function() {
    // USER DATABASE (mock data with profile picture initials and contact info)
    const USERS_DB = [
      { id: 1, name: "Rajesh Kumar", email: "rajesh@hotel.com", phone: "+91 98765 43210", username: "rajesh_k", avatar: "RK", role: null },
      { id: 2, name: "Priya Sharma", email: "priya.sharma@hotel.com", phone: "+91 87654 32109", username: "priya_s", avatar: "PS", role: null },
      { id: 3, name: "Amit Verma", email: "amit.verma@gmail.com", phone: "+91 76543 21098", username: "amit_v", avatar: "AV", role: null },
      { id: 4, name: "Sneha Patel", email: "sneha.p@booking.com", phone: "+91 65432 10987", username: "sneha_p", avatar: "SP", role: null },
      { id: 5, name: "Vikram Singh", email: "vikram.s@frontdesk.com", phone: "+91 54321 09876", username: "vikram_singh", avatar: "VS", role: null },
      { id: 6, name: "Neha Gupta", email: "neha.gupta@gmail.com", phone: "+91 43210 98765", username: "neha_g", avatar: "NG", role: null },
      { id: 7, name: "Rahul Mehta", email: "rahul.m@hospitality.com", phone: "+91 32109 87654", username: "rahul_m", avatar: "RM", role: null },
      { id: 8, name: "Anjali Nair", email: "anjali.nair@hotel.com", phone: "+91 21098 76543", username: "anjali_n", avatar: "AN", role: null },
      { id: 9, name: "Deepak Joshi", email: "deepak.j@fnb.com", phone: "+91 10987 65432", username: "deepak_j", avatar: "DJ", role: null },
      { id: 10, name: "Kavita Reddy", email: "kavita.r@gmail.com", phone: "+91 09876 54321", username: "kavita_r", avatar: "KR", role: null }
    ];

    let selectedUser = null;
    
    // DOM elements
    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('userSearchInput');
    const resultsArea = document.getElementById('searchResultsArea');
    const resultsGrid = document.getElementById('userResultsGrid');
    const editPanel = document.getElementById('editPanel');
    const userAvatarDiv = document.getElementById('userAvatar');
    const selectedUserNameSpan = document.getElementById('selectedUserName');
    const selectedUserContactSpan = document.getElementById('selectedUserContact');
    const userRoleForm = document.getElementById('userRoleForm');
    const roleRadios = document.querySelectorAll('input[name="userRole"]');
    const notificationToast = document.getElementById('notificationToast');

    function showNotification(message, isSuccess = true) {
      notificationToast.textContent = message;
      notificationToast.style.background = isSuccess ? '#0f172a' : '#dc2626';
      notificationToast.style.transform = 'translateX(-50%) translateY(0)';
      
      setTimeout(() => {
        notificationToast.style.transform = 'translateX(-50%) translateY(-100px)';
      }, 2500);
    }

    // Reset to search view (stay on same page, go back to search)
    function resetToSearchView() {
      // Clear search input
      searchInput.value = "";
      // Hide results area
      resultsArea.style.display = "none";
      resultsGrid.innerHTML = "";
      // Hide edit panel
      editPanel.style.display = "none";
      // Show search container
      searchContainer.style.display = "block";
      // Clear selected user
      selectedUser = null;
      // Clear any checked radio
      roleRadios.forEach(radio => radio.checked = false);
    }

    function renderSearchResults(query) {
      const trimmed = query.trim();
      if (trimmed === "") {
        resultsArea.style.display = "none";
        return;
      }
      
      const lowerQuery = trimmed.toLowerCase();
      const filtered = USERS_DB.filter(user => 
        user.name.toLowerCase().includes(lowerQuery) ||
        user.email.toLowerCase().includes(lowerQuery) ||
        user.phone.toLowerCase().includes(lowerQuery) ||
        user.username.toLowerCase().includes(lowerQuery)
      );
      
      resultsArea.style.display = "block";
      if (filtered.length === 0) {
        resultsGrid.innerHTML = `<div style="padding: 20px; text-align:center; color:#94a3b8;">No user found</div>`;
        return;
      }
      
      resultsGrid.innerHTML = "";
      filtered.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-item';
        if (selectedUser && selectedUser.id === user.id) {
          item.classList.add('selected');
        }
        
        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'user-avatar-small';
        avatarDiv.textContent = user.avatar;
        
        const infoDiv = document.createElement('div');
        infoDiv.className = 'user-info';
        infoDiv.innerHTML = `
          <div class="user-name">${user.name}</div>
          <div class="user-contact">${user.email} | ${user.phone}</div>
        `;
        
        item.appendChild(avatarDiv);
        item.appendChild(infoDiv);
        item.onclick = () => selectUser(user);
        resultsGrid.appendChild(item);
      });
    }

    function selectUser(user) {
      selectedUser = user;
      
      // Hide search container and results area
      searchContainer.style.display = "none";
      resultsArea.style.display = "none";
      
      // Show edit panel
      editPanel.style.display = "block";
      
      // Display user profile
      userAvatarDiv.textContent = user.avatar;
      selectedUserNameSpan.textContent = user.name;
      selectedUserContactSpan.textContent = `${user.email} | ${user.phone}`;
      
      // Clear radio selection
      roleRadios.forEach(radio => radio.checked = false);
    }

    // Form submit - assign role and stay on same page, go back to search
    userRoleForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!selectedUser) {
        showNotification("Please select a user first", false);
        return;
      }
      
      let selectedRole = null;
      for (let radio of roleRadios) {
        if (radio.checked) {
          selectedRole = radio.value;
          break;
        }
      }
      
      if (!selectedRole) {
        showNotification("Please select a role to assign", false);
        return;
      }
      
      // Show success notification
      showNotification(`✓ ${selectedRole} role assigned to ${selectedUser.name}`);
      
      console.log("User Role Assigned:", {
        userId: selectedUser.id,
        userName: selectedUser.name,
        email: selectedUser.email,
        phone: selectedUser.phone,
        username: selectedUser.username,
        role: selectedRole
      });
      
      // Reset to search view (stay on same page, go back to previous state)
      resetToSearchView();
    });
    
    // Search input event
    searchInput.addEventListener('input', (e) => {
      // If edit panel is visible, ignore (should not happen as search is hidden)
      if (editPanel.style.display === "block") return;
      
      const query = e.target.value;
      if (query.trim() === "") {
        resultsArea.style.display = "none";
        resultsGrid.innerHTML = "";
      } else {
        renderSearchResults(query);
      }
    });
    
    // Initial state
    resultsArea.style.display = "none";
    editPanel.style.display = "none";
    searchContainer.style.display = "block";
    selectedUser = null;
  })();
</script>
