<div style="margin:0; padding:0; width:100%; background:white;">
  <div id="policyToast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:#0f172a; color:white; padding:8px 16px; border-radius:40px; font-size:0.75rem; z-index:9999; transition:0.2s; pointer-events:none;"></div>

  <!-- Privacy Policy Display Mode -->
  <div id="policyDisplay" style="padding:16px 0;">
    <div id="policyContent" style="font-size:0.85rem; line-height:1.6; color:#1e293b; white-space:pre-wrap; padding:0; cursor:pointer;"></div>
  </div>

  <!-- Privacy Policy Edit Mode -->
  <div id="policyEdit" style="display:none; padding:16px 0;">
    <textarea id="policyTextarea" rows="14" style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:8px; font-size:0.85rem; line-height:1.5; font-family:inherit; resize:vertical;"></textarea>
    <div style="display:flex; gap:12px; margin-top:12px; padding:0;">
      <button id="savePolicyBtn" style="flex:1; padding:10px; background:#0f172a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:0.85rem;">Save</button>
      <button id="cancelPolicyBtn" style="flex:1; padding:10px; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; border-radius:8px; cursor:pointer; font-size:0.85rem;">Cancel</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100000; align-items:center; justify-content:center;">
  <div style="background:white; width:85%; max-width:280px; border-radius:12px; overflow:hidden;">
    <div style="background:#0f172a; padding:14px; color:white; font-weight:600; font-size:0.9rem; text-align:center;">Confirm</div>
    <div style="padding:20px; text-align:center;"><p id="confirmMsg" style="margin:0; font-size:0.9rem;">Are you sure?</p></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #eef2f6;">
      <button id="confirmNo" style="padding:12px; border:none; background:#f8fafc; color:#475569; border-right:1px solid #eef2f6; cursor:pointer;">Cancel</button>
      <button id="confirmYes" style="padding:12px; border:none; background:#f8fafc; color:#dc2626; cursor:pointer;">Confirm</button>
    </div>
  </div>
</div>

<style>
  *{margin:0; padding:0; box-sizing:border-box; scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  body, html{margin:0; padding:0;}
</style>

<script>
(function(){
  const STORAGE_KEY = 'privacy_policy';
  const defaultPolicy = `PRIVACY POLICY

Last updated: January 1, 2024

1. INFORMATION WE COLLECT
We collect personal information including name, email address, phone number, and government ID proof for verification purposes. We also collect payment information for booking confirmations.

2. HOW WE USE YOUR INFORMATION
We use your information to process bookings, communicate with you about your stay, improve our services, and comply with legal requirements. We do not sell your personal information to third parties.

3. DATA SECURITY
We implement appropriate security measures to protect your personal information from unauthorized access, alteration, disclosure, or destruction. Your data is stored on secure servers with encryption.

4. COOKIES AND TRACKING
Our website uses cookies to enhance user experience, analyze site traffic, and personalize content. You can disable cookies through your browser settings.

5. THIRD-PARTY SERVICES
We may share your information with trusted third-party service providers (payment gateways, analytics providers) who assist us in operating our business. These parties are contractually obligated to keep your information confidential.

6. YOUR RIGHTS
You have the right to access, correct, or delete your personal information. You may also request a copy of your data or withdraw consent for data processing by contacting us.

7. DATA RETENTION
We retain your personal information for as long as necessary to fulfill the purposes outlined in this policy, comply with legal obligations, resolve disputes, and enforce our agreements.

8. CHILDREN'S PRIVACY
Our services are not directed to individuals under 18. We do not knowingly collect personal information from children. If we become aware of such data, we will delete it immediately.

9. CHANGES TO THIS POLICY
We may update this privacy policy from time to time. We will notify you of any changes by posting the new policy on this page with an updated revision date.

10. CONTACT US
If you have questions about this privacy policy, please contact us at:
Email: privacy@example.com
Phone: +91 98666676543210
Address: Hotel Management System, Your City, India`;
  
  let policy = localStorage.getItem(STORAGE_KEY);
  if(!policy){
    policy = defaultPolicy;
    localStorage.setItem(STORAGE_KEY, policy);
  }
  
  function toast(msg, isErr){ 
    let t = document.getElementById('policyToast');
    t.textContent = msg;
    t.style.background = isErr ? '#b91c1c' : '#0f172a';
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => t.style.transform = 'translateX(-50%) translateY(-100px)', 2000);
  }
  
  function confirm(msg, onYes){
    let modal = document.getElementById('confirmModal');
    document.getElementById('confirmMsg').textContent = msg;
    modal.style.display = 'flex';
    let yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');
    let handler = () => { modal.style.display = 'none'; yes.removeEventListener('click', yh); no.removeEventListener('click', nh); };
    let yh = () => { handler(); onYes(); };
    let nh = () => { handler(); };
    yes.addEventListener('click', yh);
    no.addEventListener('click', nh);
  }
  
  function showDisplayMode(){
    document.getElementById('policyDisplay').style.display = 'block';
    document.getElementById('policyEdit').style.display = 'none';
    document.getElementById('policyContent').innerHTML = escapeHtml(policy).replace(/\n/g, '<br>');
  }
  
  function showEditMode(){
    document.getElementById('policyDisplay').style.display = 'none';
    document.getElementById('policyEdit').style.display = 'block';
    document.getElementById('policyTextarea').value = policy;
    document.getElementById('policyTextarea').focus();
  }
  
  function savePolicy(){
    let newPolicy = document.getElementById('policyTextarea').value;
    if(newPolicy.trim() === ''){
      toast('Privacy policy cannot be empty', true);
      return;
    }
    policy = newPolicy;
    localStorage.setItem(STORAGE_KEY, policy);
    showDisplayMode();
    toast('Privacy policy saved');
  }
  
  function cancelEdit(){
    if(document.getElementById('policyTextarea').value !== policy){
      confirm('Discard changes?', () => {
        showDisplayMode();
      });
    } else {
      showDisplayMode();
    }
  }
  
  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  }
  
  // Double click on display area to edit
  document.getElementById('policyDisplay').ondblclick = showEditMode;
  
  document.getElementById('savePolicyBtn').onclick = savePolicy;
  document.getElementById('cancelPolicyBtn').onclick = cancelEdit;
  
  document.getElementById('confirmModal').onclick = (e) => { 
    if(e.target === document.getElementById('confirmModal')) 
      document.getElementById('confirmModal').style.display = 'none'; 
  };
  
  // Force remove parent gaps
  let p = document.currentScript;
  while(p && p !== document.body) {
    if(p.style) { p.style.margin = '0'; p.style.padding = '0'; }
    p = p.parentElement;
  }
  if(document.body) { document.body.style.margin = '0'; document.body.style.padding = '0'; }
  if(document.documentElement) { document.documentElement.style.margin = '0'; document.documentElement.style.padding = '0'; }
  
  showDisplayMode();
})();
</script>
